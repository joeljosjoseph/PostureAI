services:
  - type: web
    name: postureai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fastapi_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: YOLO_CONFIG_DIR
        value: /opt/render/project/src/.runtime
      - key: FRIDGE_MODEL_PATH
        value: /var/data/best.pt
      - key: FRIDGE_INFERENCE_IMGSZ
        value: 512
      - key: FRIDGE_MAX_IMAGE_DIMENSION
        value: 1024
      - key: PYTHONIOENCODING
        value: utf-8
    disk:
      name: fridge-model-disk
      mountPath: /var/data
      sizeGB: 2
